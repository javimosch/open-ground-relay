name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go test ./...
      - run: |
          for a in amd64 arm64; do
            mkdir -p dist/og-relay-linux-$a
            GOOS=linux GOARCH=$a CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/og-relay-linux-$a/og-relay .
            cp install.sh README.md LICENSE dist/og-relay-linux-$a/
            tar -C dist -czf og-relay-linux-$a.tar.gz og-relay-linux-$a
          done
      - uses: softprops/action-gh-release@v2
        with: { files: "og-relay-linux-*.tar.gz" }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.ref_name }}
